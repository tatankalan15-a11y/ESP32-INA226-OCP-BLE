name: Build APK

# Jalan otomatis tiap ada push ke branch main/master yang menyentuh folder flutter_app,
# dan juga bisa dipicu manual lewat tab "Actions" di GitHub (tombol "Run workflow")
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate folder platform Android (jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.smartpsu .
            flutter pub get
          fi

      - name: Tambahkan permission Bluetooth ke AndroidManifest.xml
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          if "BLUETOOTH_SCAN" not in content:
              permissions = (
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH" '
                  'android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" '
                  'android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" '
                  'android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" '
                  'android:usesPermissionFlags="neverForLocation" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
              )
              content = re.sub(r'(<manifest[^>]*>)', r'\1' + permissions, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
              print("Permission Bluetooth ditambahkan ke AndroidManifest.xml")
          else:
              print("Permission sudah ada, skip.")
          PYEOF

      - name: Build APK (release)
        run: flutter build apk --release

      # APK hasil build ada di flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-psu-hp-doctor-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Kalau push berupa tag versi (misal v1.0.0), APK otomatis diunggah ke
      # halaman Release GitHub - bisa didownload publik dari HP tanpa login.
      - name: Buat GitHub Release + lampirkan APK (khusus saat push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
