name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Ensure Android project
        working-directory: flutter_app
        run: |
          set -e
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle ]; then
            rm -rf android
            flutter create --platforms=android --org com.smartpsu .
          fi
          chmod +x android/gradlew

      - name: Configure Android SDK
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          def setv(s, key, value):
              pat = rf'\b{key}(?:Version)?\s+[^\n]+'
              if re.search(pat, s):
                  return re.sub(pat, f'{key} {value}', s, count=1)
              if key == 'compileSdk':
                  return s.replace('android {', f'android {{\n    compileSdk {value}', 1)
              return s.replace('defaultConfig {', f'defaultConfig {{\n        {key} {value}', 1)
          s = setv(s, 'compileSdk', 35)
          s = setv(s, 'minSdk', 21)
          s = setv(s, 'targetSdk', 35)
          p.write_text(s)
          PY

      - name: Bluetooth permissions
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = '''    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          '''
          if 'android.permission.BLUETOOTH_SCAN' not in s:
              s = s.replace('</manifest>', perms + '</manifest>', 1)
              p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Clean
        working-directory: flutter_app
        run: flutter clean

      - name: Get dependencies again
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Verify APK
        working-directory: flutter_app
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-psu-hp-doctor-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
