name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android project exists and is complete
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradle.properties ]; then
            rm -rf android
            flutter create --platforms=android --org com.smartpsu .
          fi
          flutter pub get

      - name: Add Bluetooth permissions to AndroidManifest.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise FileNotFoundError(f"AndroidManifest.xml not found: {p}")

          s = p.read_text()

          if "BLUETOOTH_SCAN" not in s:
              permissions = '''
    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
'''
              s = s.replace('</manifest>', permissions + '\n</manifest>', 1)
              p.write_text(s)

          print("Bluetooth permissions ensured.")
          PY

      - name: Validate Android Gradle files
        run: |
          test -f android/settings.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          echo "Android project ready."

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-psu-hp-doctor-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
