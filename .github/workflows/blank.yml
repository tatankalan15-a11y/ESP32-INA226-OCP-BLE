name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# SOLUSI EROR 403: Memberikan izin agar GitHub Actions bisa menulis dan membuat Rilis/APK
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java Environment (Diperlukan untuk Android)
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Memberikan izin eksekusi pada Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Melakukan kompilasi / Build APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Membuat Tag Otomatis untuk Rilis (Agar tidak bentrok setiap kali push)
      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=v1.0.$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      # 6. Mengunggah file APK ke Halaman GitHub Releases
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
